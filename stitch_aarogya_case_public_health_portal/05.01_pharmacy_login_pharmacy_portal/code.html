</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface text-center mb-space-2xs">
      Pharmacy Portal
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-space-xl">
      Enter counter credentials to access the dispensary.
    </p>
<form class="w-full flex flex-col gap-space-lg" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface" for="pharmacy-id">
          Pharmacy ID
        </label>
<div class="relative flex items-center">
<input class="w-full h-14 px-space-md bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded transition-colors focus:outline-none focus:bg-surface-container-lowest focus:shadow-md" id="pharmacy-id" name="pharmacy-id" placeholder="e.g. PHARM-01" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface" for="password">
          Password
        </label>
<div class="relative flex items-center">
<input class="w-full h-14 pl-space-md pr-12 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded transition-colors focus:outline-none focus:bg-surface-container-lowest focus:shadow-md" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 bottom-0 w-12 flex items-center justify-center text-outline hover:text-on-surface transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-eye-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-space-xs flex flex-col gap-space-md items-center">
<button class="w-full h-14 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg shadow-md hover:bg-tertiary-container hover:shadow-lg transition-all flex items-center justify-center gap-space-xs tracking-wide cursor-pointer" type="submit">
<span>LOGIN</span>
<span class="material-symbols-outlined text-label-lg font-bold">arrow_forward</span>
</button>
<a class="font-label-md text-label-md text-secondary hover:text-on-surface transition-colors flex items-center justify-center gap-space-2xs py-space-xs" href="#">
<span class="material-symbols-outlined text-label-md">arrow_back</span>
<span>Back to Main Portal</span>
</a>
</div>
</form>
</div>
<script>
    (function() {
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('password-eye-icon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }
    })();
  </script>
