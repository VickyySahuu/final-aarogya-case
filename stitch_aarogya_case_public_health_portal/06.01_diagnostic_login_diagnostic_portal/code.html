<h1 class="font-headline-md text-headline-md text-on-surface mb-space-2xs">

    </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mb-space-xl">
      Enter laboratory / center credentials to access diagnostic queue.
    </p>
<form class="w-full flex flex-col gap-space-md text-left" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface" for="center-id">
          Diagnostic Center ID
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline select-none pointer-events-none">

          </span>

</div>
</div>
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface" for="password">

<script>
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eye-icon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }
