<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-xl p-space-xl md:p-space-2xl">
<div class="flex flex-col items-center text-center">

<h1 class="font-headline-md text-headline-md text-on-surface">
        Ambulance Portal
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs mb-space-xl">
        Enter vehicle unit credentials to access emergency dispatch queue.
      </p>
</div>
<form class="flex flex-col gap-space-lg" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-xs text-left">
<label class="font-label-md text-label-md text-on-surface" for="ambulance-id">
          Ambulance ID
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant select-none pointer-events-none text-[22px]">
            emergency
          </span>
<input class="w-full pl-12 pr-4 h-touch-min rounded-DEFAULT bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/60 font-body-lg text-body-lg focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-sm" id="ambulance-id" placeholder="e.g. AMB-DL-01-4402" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-xs text-left">
<label class="font-label-md text-label-md text-on-surface" for="ambulance-password">
          Password
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant select-none pointer-events-none text-[22px]">
            lock
          </span>
<input class="w-full pl-12 pr-12 h-touch-min rounded-DEFAULT bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/60 font-body-lg text-body-lg focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-sm" id="ambulance-password" placeholder="••••••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 p-2 text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center rounded-full" id="toggle-pwd" type="button">
<span class="material-symbols-outlined text-[22px]" id="eye-icon">
              visibility
            </span>
</button>
</div>
</div>
<div class="mt-space-sm">
<button class="w-full h-touch-min bg-[#166534] hover:bg-green-800 text-on-primary font-label-lg text-label-lg rounded-full shadow-sm flex items-center justify-center gap-space-xs transition-colors" type="submit">
<span>LOGIN</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface text-center block w-full mt-4 py-2 rounded-full transition-colors" href="#">
          ← Back to Main Portal
        </a>
</div>
</form>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-pwd');
    const pwdInput = document.getElementById('ambulance-password');
    const eyeIcon = document.getElementById('eye-icon');
    
    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
