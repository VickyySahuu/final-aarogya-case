<div class="relative w-full max-w-[480px]">
<div class="absolute -top-12 -left-12 w-64 h-64 bg-primary-fixed-dim/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-10 -right-10 w-64 h-64 bg-secondary-fixed/30 rounded-full blur-3xl pointer-events-none"></div>
<div class="relative w-full bg-surface-container-lowest rounded-xl shadow-xl p-space-xl sm:p-space-2xl flex flex-col items-center">
<div class="w-20 h-20 sm:w-24 sm:h-24 mb-space-lg rounded-full bg-surface-container-low p-space-xs flex items-center justify-center shadow-sm">
<img alt="Official Administration Emblem" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCA1Vk96spC04s2RkWezfcLmTHGwQVKOyho13RDhaM4pQBqQJq7BqNTltgMfnfErdr7LyS_P0ULGGLWdJ1tQewk6EF9etVNDmJekymww2TmaTl9ZZpvRRo9Ufg2cDq-0-LS1qYpyvDSEuxAUWXSiW5pwLFMxk2aLKHl06ZvdH_6NLyXjjZIQSXZAqikatm-KfEZn41xA9CneJWp9mC6b_eyFasaaPkBhyvn1duAc-Hm4RQTetQdOrJFiyCVyDdUkdG3tSI"/>
</div>
<div class="text-center mb-space-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Admin Portal</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">
          Enter central administration credentials to access configuration console.
        </p>
</div>
<form class="w-full flex flex-col gap-space-lg" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="admin-id">Admin ID</label>
<div class="relative flex items-center">
<span class="absolute left-space-md text-on-surface-variant pointer-events-none flex items-center justify-center">
<span class="material-symbols-outlined text-[22px]">admin_panel_settings</span>
</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md pl-12 pr-space-md py-3.5 rounded min-h-[3.5rem] placeholder:text-outline/60 focus:outline-none focus:bg-surface-container-low transition-colors" id="admin-id" placeholder="e.g. ADM-HQ-2025-01" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<span class="absolute left-space-md text-on-surface-variant pointer-events-none flex items-center justify-center">
<span class="material-symbols-outlined text-[22px]">lock</span>
</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md pl-12 pr-12 py-3.5 rounded min-h-[3.5rem] placeholder:text-outline/60 focus:outline-none focus:bg-surface-container-low transition-colors" id="password" placeholder="••••••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-space-xs text-on-surface-variant hover:text-on-surface p-space-xs rounded-full transition-colors flex items-center justify-center" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[22px]" id="password-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-space-xs">
<button class="w-full bg-[#166534] text-white font-label-lg text-label-lg min-h-[3.5rem] sm:min-h-touch-min rounded-full flex items-center justify-center gap-space-xs shadow-md hover:bg-[#14532d] active:scale-[0.99] transition-all" type="submit">
<span>LOGIN</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-space-xl pt-space-xs">
<a class="inline-flex items-center gap-space-2xs text-secondary hover:text-on-secondary-fixed font-label-md text-label-md transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-0.5 transition-transform">arrow_back</span>
<span>Back to Main Portal</span>
</a>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('password-icon');

    if (toggleBtn && pwdInput && icon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        icon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
